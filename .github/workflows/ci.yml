name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Environment diagnostics
        shell: pwsh
        run: |
          dotnet --version
          dotnet --info
          dotnet sln ReminNote.sln list

      - name: P0-07 repository verification
        shell: pwsh
        run: ./scripts/verify-p0-07.ps1

      - name: Restore and Release build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Real tests and P0-07
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release
