name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Environment diagnostics
        shell: pwsh
        run: |
          dotnet --version
          dotnet --info
          dotnet sln ReminNote.sln list

      - name: P0-07 repository verification
        shell: pwsh
        run: ./scripts/verify-p0-07.ps1

      - name: Restore and Release build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Real tests and P0-07
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release

  alpha-package:
    name: Alpha package gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate alpha tag and package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+-alpha\.\d+)$') {
            throw "Only v<semver>-alpha.<n> tags may enter the Alpha package gate: $env:GITHUB_REF_NAME"
          }
          $version = $Matches.version
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'ReminNote-Alpha'
          ./scripts/package-alpha.ps1 -Version $version -OutputRoot $artifactRoot -HumanAcceptance NOT_PERFORMED
          $manifest = Get-ChildItem -LiteralPath $artifactRoot -Recurse -Filter release-manifest.json -File | Select-Object -First 1
          if ($null -eq $manifest) {
            throw 'Alpha package did not produce release-manifest.json.'
          }
          $metadata = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
          if ($metadata.commit -ne (git rev-parse HEAD)) {
            throw 'Release manifest commit does not match the tagged HEAD.'
          }
          $zip = Join-Path $manifest.DirectoryName $metadata.package
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Alpha ZIP is missing: $zip"
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $metadata.sha256) {
            throw 'Alpha ZIP SHA-256 does not match release-manifest.json.'
          }

      - name: Upload Alpha package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ReminNote-${{ github.ref_name }}-package-evidence
          path: ${{ runner.temp }}/ReminNote-Alpha/**
          if-no-files-found: error
