name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Environment diagnostics
        shell: pwsh
        run: |
          dotnet --version
          dotnet --info
          dotnet sln ReminNote.sln list

      - name: P0-07 repository verification
        shell: pwsh
        run: ./scripts/verify-p0-07.ps1

      - name: Restore
        run: dotnet restore ReminNote.sln --locked-mode

      - name: Build
        run: dotnet build ReminNote.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ReminNote.sln --configuration Release --no-build --no-restore
